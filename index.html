<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Home Page | AHMAD ALI</title>

    <link rel="stylesheet" href="Home.css" />
  </head>

  <body>

    <header class="header">

      <div class="header-logo">
        AHMAD <span class="header-logo-text-2">ALI</span>
      </div>
      <a href="Admin.html" class="header-logo-text-2" style="cursor: pointer;">Click to go admin panel.</a>

      <div class="cart-box">
        <svg class="cart-box-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" > <path d="M331.8 440.4a45.8 45.8 0 1 1 91.5 .3 45.8 45.8 0 1 1 -91.5-.3zM169.4 394.9a45.7 45.7 0 1 0 .3 91.3 45.7 45.7 0 1 0 -.3-91.3zm291.7-270c-302.2 0-379.2-12.8-461.1-99.2 34.4 51.7 53.3 148.9 373.1 144.2 333.3-5 130 86.1 70.8 188.9 186.7-166.7 319.4-233.9 17.2-233.9z"/></svg>
        <span id="cart-count" class="cart-box-count"></span>
      </div>

    </header>

    <main>

      <section class="products-section">

        <h2 class="section-title">Featured Products</h2>

        <ul class="product-grid">

          <li class="product-card">

            <a href="#" class="product-card-link">
            
              <div class="product-card-media">
                <img  class="product-card-media-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgipInf-N4cYoxEQ1GGaKRMHM1UvJ0Areyz28YCzbmIQ&s=10" loading="lazy" />
                <span class="product-card-badge" >-12%</span>
              </div>

              <div class="product-card-body">
                <p class="product-card-category">Water Tanks</p>
                <h3 class="product-card-name">1000L Vertical Water Storage Tank</h3>
                <div class="product-card-price">
                  <span class="product-card-price-current">PKR 24,500</span>
                  <span class="product-card-price-old">PKR 28,000</span>
                </div>
              </div>

            </a>
            <button type="button" class="product-card-cart-btn">Add to cart</button>

          </li>

        </ul>
      </section>
      
    </main>

    <script src="Home.js"></script>
  </body>
</html>
