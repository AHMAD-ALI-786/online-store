<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Page | AHMAD ALI</title>

    <link rel="stylesheet" href="../Online_Store/Home.css" />

    <link rel="stylesheet" href="../Online_Store/Admin.css" />
  </head>

  <body>
    <header class="header admin-header">
      <svg
        class="cart-box-icon admin-cart"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 448 512"
      >
        <path
          d="M224 248a120 120 0 1 1 0-240 120 120 0 1 1 0 240zm-30.5 56l61 0c9.7 0 17.5 7.8 17.5 17.5 0 4.2-1.5 8.2-4.2 11.4l-27.4 32 31 115.1 .6 0 34.6-138.5c2.2-8.7 11.1-14 19.5-10.8 61.9 23.6 105.9 83.6 105.9 153.8 0 15.1-12.3 27.4-27.4 27.4L43.4 512c-15.1 0-27.4-12.3-27.4-27.4 0-70.2 44-130.2 105.9-153.8 8.4-3.2 17.3 2.1 19.5 10.8l34.6 138.5 .6 0 31-115.1-27.4-32c-2.7-3.2-4.2-7.2-4.2-11.4 0-9.7 7.8-17.5 17.5-17.5z"
        />
      </svg>
      <span class="admin-welcome"> Welcome to the Admin Panel </span>
    </header>

    <main>
      <section class="add-product-dynamically">
        <h2 class="section-title">
          Add product card in your home page, dynamically.
        </h2>

        <button id="add-btn" type="button" class="btn">
          Add New Product Card +
        </button>

        <form class="product-form hidden" action="#" method="post">
          <h2 class="product-form-title">Add New Product</h2>

          <div class="product-form-field">
            <label class="product-form-label" for="img-src">
              Enter product img URL*
            </label>
            <input
              class="product-form-input"
              id="img-src"
              type="url"
              required
            />
          </div>

          <div class="product-form-field">
            <label class="product-form-label" for="img-alt">
              Enter product img alternate*
            </label>
            <input
              class="product-form-input"
              id="img-alt"
              type="text"
              autocomplete="off"
              required
            />
          </div>

          <div class="product-form-field">
            <label class="product-form-label" for="badge">
              Enter product badge
            </label>
            <input
              class="product-form-input"
              id="badge"
              type="text"
              placeholder="e.g. -20% or New"
            />
          </div>

          <div class="product-form-field">
            <label class="product-form-label" for="category">
              Enter product category*
            </label>
            <input
              class="product-form-input"
              id="category"
              type="text"
              placeholder="e.g. Water Tanks"
              autocomplete="off"
              required
            />
          </div>

          <div class="product-form-field">
            <label class="product-form-label" for="name">
              Enter product name*
            </label>
            <input
              class="product-form-input"
              id="name"
              type="text"
              placeholder="e.g. 1000L Vertical Tank"
              autocomplete="off"
              required
            />
          </div>

          <div class="product-form-field">
            <label class="product-form-label" for="old-price"
              >Enter product old price</label
            >
            <input
              class="product-form-input"
              id="old-price"
              type="number"
              min="0"
              placeholder="28,000"
            />
          </div>

          <div class="product-form-field">
            <label class="product-form-label" for="new-price"
              >Enter product current price*</label
            >
            <input
              class="product-form-input"
              id="new-price"
              type="number"
              min="0"
              placeholder="24,500"
              required
            />
          </div>

          <button class="btn" type="submit">Submit</button>
          <button class="btn" id="form-cancel-btn" type="button">Cancel</button>
        </form>
      </section>

      <section class="remove-product-dynamically">
        <h2 class="section-title">Your Products info.</h2>

          <div class="product-form-field">
            <input
              class="product-form-input"
              id="search_bar"
              placeholder="🔍 Search kra by product name or category name...."
              type="search"
            />
          </div>


        <div class="products-table-card">
          <table class="products-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Image URL</th>
                <th>Image alt</th>
                <th>Badge</th>
                <th id="name_thead">Name ▲▼</th>
                <th id="category_thead" >Category </th>
                <th id="current_price_thead">Current Price ▲▼</th>
                <th id="old_price_thead">Old Price ▲▼</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

        <div class="popup hidden">
          <h3>Are you sure you want to delete this?</h3>

          <div class="popup-buttons">
            <button class="cancel-btn">Cancel</button>
            <button class="delete-btn">Yes</button>
          </div>
        </div>
      </section>
    </main>

    <script src="../Online_Store/admin.js"></script>
  </body>
</html>
